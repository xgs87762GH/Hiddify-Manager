
services:
  hiddifymanager:
    # Published install (docker-installer.sh): pulls this image. Local/dev builds
    # that need `build: .` should use an override file or comment the image line.
    image: ghcr.io/xgs87762gh/hiddify-manager:latest
    #build: .

    restart: always
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./docker-data/:/opt/hiddify-manager/data/   # Persistent panel data: SSL, logs, backups, generated state
    network_mode: host                               # Binds 80/443 and all proxy ports directly
    env_file:
      - path: ./docker.env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:latest

    restart: always
    ports:
      - "127.0.0.1:3306:3306"

    env_file:
      - path: ./docker.env
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1       # Root user password
      MYSQL_DATABASE: hiddifypanel             
      MYSQL_USER: hiddifypanel                     
    volumes:
      - ./docker-data/mariadb_data:/var/lib/mysql          # Persistent storage for database files
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      retries: 10
  redis:

    image: redis:latest

    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    env_file:
      - path: ./docker.env
    command: sh -c "redis-server --requirepass \"$$REDIS_PASSWORD\""
    volumes:
      - ./docker-data/redis_data:/data                # Persistent storage for Redis data
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 5s
      retries: 10
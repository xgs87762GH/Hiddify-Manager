protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300
supervised systemd
pidfile /var/run/hiddify-redis-server.pid
loglevel notice
logfile /opt/hiddify-manager/data/log/redis-server.log
databases 16
always-show-logo yes
dir /opt/hiddify-manager/data/redis/
bind 127.0.0.1
# Cap Redis RSS: the panel caches into Redis with TTLs, but without a cap it can grow
# until the OOM killer fires on small VPS. Evict least-recently-used keys under pressure.
maxmemory 256mb
maxmemory-policy allkeys-lru

name: shell-check

# Every script needs to stay parseable by bash on the server: a single CRLF file
# or a stray brace only shows up there, minutes into an install.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: No CRLF line endings
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            if grep -qU $'\r' "$f"; then
              echo "CRLF: $f"
              bad=1
            fi
          done < <(git ls-files '*.sh' 'scripts/hiddify' '*.py' '.github/workflows/*.yml')
          [ "$bad" = "0" ] || { echo "CRLF line endings found, see .gitattributes"; exit 1; }

      - name: bash -n on every shell script
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done < <(git ls-files '*.sh')

      - name: shellcheck
        # --shell=bash: 一部分脚本是被 source 的库（没有 shebang），它们的
        # 解释器就是 bash——上一步 bash -n 也基于这个假设。
        run: shellcheck --shell=bash --severity=error $(git ls-files '*.sh')

      - name: Smoke test the update flow
        run: bash scripts/tests/smoke_update.sh 1

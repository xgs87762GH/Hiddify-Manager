  release:
    # if: startsWith(github.ref, 'refs/tags/v')
    name: Create Release
    runs-on: ubuntu-latest
    # needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          # by default, it uses a depth of 1
          # this fetches all history so that we can read each commit
          fetch-depth: 0
          # the panel lives in the services/panel/src submodule: without it the zip
          # would ship an empty panel directory and installs from the zip would fail
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install gitchangelog pystache
          sudo apt install -y zip
      - name: zip
        run: |
            # .git* would leak history and bloat the package; everything else ships
            zip -r hiddify-manager.zip . -x '.git*' -x '*.git/*'
            cp  hiddify-manager.zip hiddify-config.zip 
            cp  hiddify-manager.zip hiddify-server.zip 
      - name: Generate Changelog
        run: .github/release_message.sh > release_message.md
      - name: Use curated notes when present
        # A hand written .github/release_notes/<tag>.md wins over the generated changelog
        run: |
          notes=".github/release_notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" release_message.md; fi
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.zip"
          prerelease: ${{ contains(github.ref_name,'b') }}
          body_path: release_message.md
    